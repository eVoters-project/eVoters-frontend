

<div id="gmap">
  <google-map
    width="100%"
    height="95%"
    [options]="mapConfig()"
    (mapClick)="onMapClick($event);">

    @if (markerCoordinates()) {
      <map-marker
        #marker="mapMarker"
        [position]="markerCoordinates()!"
        [options]="markerConfig()"
        (mapClick)="onMapMarkerClick(marker);">
      </map-marker>
    }

    <map-info-window [options]="mapInfoConfig()">
      <div
        [ngTemplateOutlet]="infoWindow"
        [ngTemplateOutletContext]="{ latlng: marker?.getPosition() }">
      </div>
    </map-info-window>

  </google-map>

  <br>

  <div>
    <strong>Voter: </strong>
    <span>{{dialogData.data?.name}}</span>
  </div>
</div>

<ng-template #infoWindow let-data="latlng">
  <div>
    <div>
      <strong>Lat: </strong>
      <span>{{ data?.lat() }}</span>
    </div>
    <div>
      <strong>Lng: </strong>
      <span> {{ data?.lng() }}</span>
    </div>
    <br>
    <button
      pButton
      pRipple
      label="Save"
      [loading]="isLoading"
      (click)="setVoterCoordinates();"
      [style]="{ 'width': '100%' }">
    </button>
  </div>



</ng-template>
