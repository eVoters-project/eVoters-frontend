<div class="card">

    <div class="title-bar">
        <h3 class="title">Voters</h3>
        <div class="title-bar-menu">
            <p-button label="Add" (onClick)="addVoterSidebarVisible = true"/>
        </div>
    </div>
  
    <p-table [columns]="cols" [value]="voters" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td *ngFor="let col of columns">
                    {{ rowData[col.field] }}
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-sidebar [(visible)]="addVoterSidebarVisible" position="right" styleClass="w-30rem">
        <ng-template pTemplate="header">
            <span class="font-bold">New Voter</span>
        </ng-template>

        <div class="flex flex-column gap-2">
            <label for="firstname">Firstname</label>
            <input id="firstname" pInputText type="text" class="outline-none" />
        </div>
        <div class="flex flex-column gap-2">
            <label for="middlename">Middlename</label>
            <input id="middlename" pInputText type="text" class="outline-none" />
        </div>
        <div class="flex flex-column gap-2">
            <label for="lastname">Lastname</label>
            <input id="lastname" pInputText type="text" class="outline-none" />
        </div>

        <div class="flex flex-row gap-2"> 
            <div class="flex flex-auto flex-column gap-2">
                <label for="gender">Gender</label>
                <p-dropdown [options]="genders" optionLabel="name"/>
            </div>
    
            <div class="flex flex-auto flex-column gap-2">
                <label for="dateofbirth">Date of Birth</label>
                <p-calendar [showIcon]="true" class="outline-none"/>
            </div>
        </div>

    </p-sidebar>

</div>
