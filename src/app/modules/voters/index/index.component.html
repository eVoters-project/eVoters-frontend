<p-confirmDialog />
<p-toast />
<div class="card">

    <div class="title-bar">
        <h3 class="title">Voters</h3>
        <div class="title-bar-menu">
            <p-button label="Add" (onClick)="voterEntry()"/>
        </div>
    </div>

    <br />
    <br />

    <p-table
      [columns]="cols"
      [value]="voters"
      [rowsPerPageOptions]="[5, 10, 15]"
      [rows]="10"
      [paginator]="true"
      [loading]="isLoading"
      [rowHover]="true"
      [contextMenu]="cmVoter"
      [(contextMenuSelection)]="voter"
      [(selection)]="voter"
      [globalFilterFields]="['precinct_no', 'firstname', 'middlename', 'lastname', 'status']"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
      >
        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            <div class="flex gap-2">
              <p-button
                label="Verified Voters"
                icon="pi pi-check-circle"
                [rounded]="true"
                severity="info"
                class="grid-filter-button"
                [ngClass]="{ 'grid-filter-button-icon': voterFilterSequence == 1 }"
                (onClick)="voterFilterSequence != 1 ?
                  voterFilterSequence = 1
                  : voterFilterSequence = 0;
                  ApplyFilters();" />
              <p-button
                label="Confirmed Leaders"
                icon="pi pi-check-circle"
                [rounded]="true"
                severity="info"
                class="grid-filter-button"
                [ngClass]="{ 'grid-filter-button-icon': voterFilterSequence == 2 }"
                (onClick)="voterFilterSequence != 2 ?
                  voterFilterSequence = 2
                  : voterFilterSequence = 0;
                  ApplyFilters();" />
              <p-button
                label="Unassigned Voters"
                icon="pi pi-check-circle"
                [rounded]="true"
                severity="info"
                class="grid-filter-button"
                [ngClass]="{ 'grid-filter-button-icon': voterFilterSequence == 3 }"
                (onClick)="voterFilterSequence != 3 ?
                  voterFilterSequence = 3
                  : voterFilterSequence = 0;
                  ApplyFilters();" />
            </div>

            <p-button icon="pi pi-refresh" (onClick)="voterService.requestData(); voterFilterSequence = 0;"/>
          </div>
        </ng-template>
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                    <p-columnFilter type="text" [field]="col.field" display="menu" />
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr [pContextMenuRow]="rowData" [ngClass]="{ 'row-accessories': getVoterLatLngInvalid(rowData) }">
                @for (col of columns; track $index) {
                  <td>
                    @switch (col.field) {
                      @case ('id') {
                      }
                      @case ('vote_status') {
                        <p-tag [value]="rowData[col.field]" [severity]="getVoteStatus(rowData[col.field])" />
                      }
                      @default {
                        {{ rowData[col.field] }}
                      }
                    }
                  </td>
                }
            </tr>
        </ng-template>
    </p-table>

    <p-sidebar [(visible)]="addVoterSidebarVisible" position="right" styleClass="w-30rem">
        <ng-template pTemplate="header">
            <h3 class="m-0">New Voter</h3>
        </ng-template>

        <ng-template pTemplate="footer">
          <p-button label="submit"/>
        </ng-template>

    </p-sidebar>

</div>


<!-- <p-menu #gridMenu [model]="gridMenus" [popup]="true"></p-menu> -->
<p-contextMenu #cmVoter [model]="gridContextMenus"></p-contextMenu>
