<p-confirmDialog />
<p-toast />
<div class="card">
  <div class="title-bar">
    <h3 class="title">Candidates</h3>
    <div class="title-bar-menu gap-1">
      <div>
        <p-button label="Add Party Candidate"
          (onClick)="candidateEntry('Party')"/>
      </div>
      <div>
        <p-button label="Add Independent Candidate"
          (onClick)="candidateEntry('Independent')" />
      </div>
    </div>
  </div>

  <br />

  <div
    class="flex gap-2 mb-2"
    [formGroup]="rf" >
    <p-dropdown
      name="schedule"
      [options]="schedules!"
      optionLabel="name"
      [loading]="schedules == null"
      formControlName="schedule"
      placeholder="Select a Schedule"
    />
  </div>

  <p-table
      [columns]="cols"
      [value]="leaders"
      [rowsPerPageOptions]="[5, 10, 15]"
      [rows]="10"
      [paginator]="true"
      [loading]="isLoading"
      [rowHover]="true"
      [contextMenu]="cmLeader"
      [(contextMenuSelection)]="leader"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
      >
        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            Candidate List
            <p-button icon="pi pi-refresh" (onClick)="candidateService.requestData(null);"/>
          </div>
        </ng-template>
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr [pContextMenuRow]="rowData">
                @for (col of columns; track $index) {
                  <td>
                    @switch (col.field) {
                      @case ('id') {
                      }
                      @case ('status') {
                        <p-tag [value]="rowData[col.field]" />
                      }
                      @default {
                        {{ rowData[col.field] }}
                      }
                    }
                  </td>
                }
            </tr>
        </ng-template>
  </p-table>

</div>


<p-contextMenu #cmLeader [model]="gridContextMenus"></p-contextMenu>
