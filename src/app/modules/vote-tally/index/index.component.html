<p-confirmDialog />
<p-toast />
<div class="card">
  <div class="title-bar">
    <h3 class="title">{{title}}</h3>
    <div class="title-bar-menu">
        <p-button label="Add" (onClick)="voteTallyEntry()"/>
    </div>
  </div>

  <br />
  <br />

  <p-table
      [columns]="cols"
      [value]="voteTallies ?? []"
      [rowsPerPageOptions]="[5, 10, 15]"
      [rows]="10"
      [paginator]="true"
      [loading]="isLoading"
      [rowHover]="true"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
      >

      <!-- caption -->
        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            Party List
            <p-button icon="pi pi-refresh" (onClick)="voteTallyService.requestData();" />
          </div>
        </ng-template>

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
        </ng-template>

        <!-- body -->
        <ng-template pTemplate="body" let-rowData let-expanded="expanded">
            <tr [pContextMenuRow]="rowData">
              @for (column of cols; track $index) {
                @if (column.header === 'Name') {
                  <td class="flex align-items-center py-1">
                    <p-button
                      type="button"
                      pRipple
                      [pRowToggler]="rowData"
                      [text]="true"
                      [rounded]="true"
                      [plain]="true"
                      size="small"
                      class="mr-2"
                      [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />

                  <strong>{{rowData[column.field]}}</strong>
                }
                @else {
                  <td>
                    {{rowData[column.field]}}
                  </td>
                }
              }
            </tr>
        </ng-template>
    </p-table>
</div>
