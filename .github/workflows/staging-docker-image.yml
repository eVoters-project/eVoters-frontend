name: ci-cd

on:
  push:
    branches:
      - 'dev'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Docker Setup QEMU
      uses:  docker/setup-qemu-action@v2

    - name: Docker Setup Buildx
      uses:  docker/setup-buildx-action@v2

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}
        password: ${{ secrets.STAGING_DOCKERHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v3
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}

        push: true
        tags: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-frontend:latest
        cache-from: type=registry,ref=${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-frontend:buildcache
        cache-to: type=registry,ref=${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-frontend:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: 22
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd deployment-scripts/e-voters/
            docker compose pull evoters_frontend
            docker compose up evoters_frontend -d
            docker compose logs --tail 20 evoters_frontend
